# Полный конфиг для golangci-lint v2
# Подходит для production-проектов на Go
# Адаптирован под проект github.com/mathbdw/subscription-service

version: "2"

# ==========================================
# НАСТРОЙКИ ЛИНТЕРОВ (ПРОВЕРКА КОДА)
# ==========================================
linters:
  # default: none - отключаем все линтеры по умолчанию,
  # чтобы включить только нужные вручную
  default: none
  
  # Список линтеров, которые будут запускаться
  enable:
    # ----- Базовые линтеры (обязательные) -----
    - errcheck          # Проверяет, что все ошибки обработаны (не игнорируются через _)
    - govet             # Стандартный анализатор Go: ищет подозрительные конструкции
    - ineffassign       # Находит бесполезные присваивания (переменной присвоили, но не использовали)
    - staticcheck       # Мощный линтер: находит логические ошибки, утечки, плохие практики
    - unused            # Находит неиспользуемые функции, переменные, типы, поля
    
    # ----- Линтеры для работы с БД -----
    - sqlclosecheck     # Проверяет, что SQL-ресурсы (Rows, Stmt, Conn) закрыты
    - rowserrcheck      # Проверяет, что после rows.Next() вызывается rows.Err()
    
    # ----- Линтеры для безопасности и надёжности -----
    - gosec             # Проверяет код на уязвимости (безопасность)
    
    # ----- Линтеры для чистоты кода -----
    - revive            # Замена golint: проверяет стиль, именование, коментарии
    - misspell          # Находит опечатки в комментариях и строковых литералах
    
    # ----- Линтеры для сложности кода -----
    - gocyclo           # Проверяет цикломатическую сложность функций
    - gocognit          # Проверяет когнитивную сложность (понятность кода)
    
    # ----- Линтеры для тестов -----
    - testifylint       # Проверяет правильность использования testify (assert/require)
    - paralleltest      # Проверяет, что тесты используют t.Parallel() где можно
    
    # ----- Линтеры для документации -----
    - godot             # Проверяет, что комментарии заканчиваются точкой
    
    # ----- Линтеры для производительности -----
    - prealloc          # Предлагает preallocate слайсы, если размер известен
    
  # ==========================================
  # НАСТРОЙКИ КОНКРЕТНЫХ ЛИНТЕРОВ
  # ==========================================
  settings:
    # ----- Настройка errcheck -----
    errcheck:
      # Проверять ошибки даже при приведении типов (type assertion)
      check-type-assertions: true
      # Проверять ошибки, которые явно игнорируются через _ = ...
      check-blank: true
      # Пустой список = проверять все функции (никаких исключений)
      exclude-functions: []
    
    # ----- Настройка staticcheck -----
    staticcheck:
      # Включить все проверки (all), кроме тех, что помечены как "необязательные"
      # SA5001 - проверяет rows.Err() после итерации
      # SA1000 - устаревшая проверка, можно отключить
      checks:
        - all
        - -SA1000  # Отключаем устаревшую проверку
    
    # ----- Настройка govet -----
    govet:
      # Включаем проверку затенения переменных (shadowing)
      enable:
        - shadow
      # Отключаем проверку, которая может давать ложные срабатывания
      disable:
        - composites
    
    # ----- Настройка revive -----
    revive:
      # Используем строгий набор правил
      severity: warning
      rules:
        # Экспортируемые функции должны иметь комментарий
        - name: exported
          severity: warning
          disabled: false
        # Константы должны быть в верхнем регистре (для экспортируемых)
        - name: var-naming
          severity: warning
          disabled: false
        # Не использовать пустой блок (for {})
        - name: empty-block
          severity: warning
          disabled: false
        # Не использовать глубокую вложенность (if/else)
        - name: deep-exit
          severity: warning
          disabled: false
    
    # ----- Настройка gocyclo -----
    gocyclo:
      # Минимальная сложность функции для предупреждения
      min-complexity: 15
    
    # ----- Настройка gocognit -----
    gocognit:
      # Минимальная когнитивная сложность
      min-complexity: 20
    
    # ----- Настройка rowserrcheck -----
    rowserrcheck:
      # Проверять пакеты, связанные с SQL
      packages:
        - database/sql
        - github.com/jmoiron/sqlx
    
  # ==========================================
  # ИСКЛЮЧЕНИЯ ДЛЯ ЛИНТЕРОВ
  # ==========================================
  exclusions:
    # Сгенерированный код: lax - проверять, но не требовать идеального стиля
    generated: lax
    
    # Использовать стандартные пресеты исключений:
    # - comments: исключить проблемы с комментариями в тестах
    # - common-false-positives: исключить частые ложные срабатывания
    # - legacy: исключить устаревшие проверки
    # - std-error-handling: исключить проверки обработки ошибок в стандартных пакетах
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    
    # Исключить конкретные пути из проверки (регулярные выражения)
    paths:
      - third_party$     # Сторонний код
      - builtin$         # Встроенный код
      - examples$        # Примеры
      - .*_mock\.go$     # Сгенерированные моки (gomock)
      - .*\.pb\.go$      # Сгенерированный protobuf
      - .*_test\.go$     # Тесты (можно исключить, если не хотим проверять)
    
    # Исключить правила по тексту ошибки
    rules:
      # Игнорировать неиспользуемый код в тестах
      - path: _test\.go
        linters:
          - unused
          - gocyclo
          - gocognit
      
      # Игнорировать предупреждения о безопасности в тестах
      - path: _test\.go
        linters:
          - gosec
      
      # Игнорировать проверки ошибок в тестах (если нужно)
      - path: _test\.go
        linters:
          - errcheck

# ==========================================
# НАСТРОЙКИ ФОРМАТЕРОВ (АВТОИСПРАВЛЕНИЕ)
# ==========================================
formatters:
  # Форматеры, которые будут запускаться при --fix
  enable:
    - gofmt             # Базовое форматирование (отступы, пробелы)
    - goimports         # Управление импортами: добавляет, удаляет, группирует
    - gci               # Расширенное управление группировкой импортов
  
  # Настройки форматеров
  settings:
    # ----- Настройка goimports -----
    goimports:
      # Префикс вашего проекта (чтобы выделить локальные пакеты в отдельную группу)
      local-prefixes: "github.com/mathbdw/subscription-service"
    
    # ----- Настройка gci (более мощный, чем goimports) -----
    gci:
      # Включаем кастомный порядок секций
      custom-order: true
      # Определяем порядок групп импортов
      sections:
        - standard                # 1. Стандартные пакеты Go (fmt, net/http и т.д.)
        - default                 # 2. Внешние пакеты (github.com/...)
        - prefix(github.com/mathbdw/subscription-service)  # 3. Локальные пакеты (ваш проект)
        - blank                   # 4. Импорты с _ (например, _ "github.com/lib/pq")
        - dot                     # 5. Импорты с . (например, . "testing")
      # Включаем проверку порядка импортов в тестах
      skip-generated: false
      no-inline-sort: false
    
    # ----- Настройка gofmt -----
    gofmt:
      # Упрощать код (например, убирать лишние скобки)
      simplify: true
  
  # Исключения для форматеров
  exclusions:
    # Сгенерированный код: lax - форматировать, но не требовать идеала
    generated: lax
    
    # Исключить пути из форматирования
    paths:
      - third_party$
      - builtin$
      - examples$
      - .*_mock\.go$
      - .*\.pb\.go$

# ==========================================
# ОБЩИЕ НАСТРОЙКИ ЗАПУСКА
# ==========================================
run:
  # Таймаут выполнения (увеличьте для больших проектов)
  timeout: 5m
  
  # Количество одновременно проверяемых файлов (по умолчанию - число CPU)
  concurrency: 4
  
  # Тесты включены (проверяем и тесты тоже)
  tests: true
  
  # Не использовать стандартные исключения для тестов (проверяем всё)
  skip-test-files: false
  
  # Версия Go, для которой проверяется совместимость
  go: "1.24"

# ==========================================
# ВЫВОД РЕЗУЛЬТАТОВ
# ==========================================
output:
  # В v2 формат задается через карту (map), а не через слайс
  format: text  # или json, checkstyle, sarif, etc.
  
  # Показывать статистику по линтерам
  show-stats: true
  
  # Сортировка результатов: по линтеру, затем по файлу
  sort-order:
    - linter
    - file