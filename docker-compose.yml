version: "3.9"

services:
  http-server:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    # restart: unless-stopped
    env_file:
      - .env
    networks:
      - ompnw
    depends_on:
      - postgres
    ports:
      - 8080:8080 # REST
    volumes:
      - ./migrations:/root/migrations:ro
      - ./config.yml:/root/config.yml:ro
      - .:/workspace

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/16/data
    networks:
      - ompnw

volumes:
  pgdata:
    driver: local

networks:
  ompnw:
    driver: bridge
