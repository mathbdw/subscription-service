name: Export CI/CD Traces

on:
  workflow_run:
    # Слушаем завершение всех workflow в репозитории
    # Можно указать конкретные: ["Go CI Pipeline"]
    workflows: ["*"]
    types:
      - completed

jobs:
  otel-export:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Setup SSH tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -f -N -L 4318:localhost:4318 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}

      - name: Export workflow trace
        uses: paper2/github-actions-opentelemetry@main
        env:
          OTEL_SERVICE_NAME: subscription-service-ci
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_COLLECTOR_ENDPOINT }}
          